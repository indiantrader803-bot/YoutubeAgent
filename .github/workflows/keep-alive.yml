name: 24/7 Serverless Daily Video Automation

on:
  schedule:
    # Once daily at 6:00 AM IST (00:30 UTC). One run produces 1 Short + 1
    # long-form, keeping the channel under YouTube's daily upload cap.
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    # TEMPORARY: live-deployment trigger (removed right after the run starts).
    branches: [master]
    paths: ['.github/workflows/keep-alive.yml']

jobs:
  run-daily-automation:
    runs-on: ubuntu-latest
    # The owner stores all secrets in the repo Environment "ENV" (id
    # 19935994265) — declaring it here is what makes YOUTUBE_*/GMAIL_*/etc.
    # visible to the daily run. No protection rules => zero wait time.
    environment: ENV
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & FFmpeg
        run: |
          npm ci
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate and publish daily videos (1 Short + 1 long-form)
        id: automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Free AI video renderer (vendored in vendor/agnes-video-generator).
          # Get a key at https://platform.agnes-ai.com and add it as the
          # AGNES_API_KEY secret — when set, daily videos render through Agnes
          # (AI scenes + Edge-TTS narration + subtitles) instead of the FFmpeg
          # chain. When unset, rendering falls back to Pexels/FFmpeg as before.
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # Videos go PUBLIC immediately after upload: at 0 subscribers the
          # Shorts feed tests each upload right away, and every hour parked
          # private is a lost hour of impressions. Revisit scheduling only
          # after the channel has a subscriber base in a target timezone.
          DEFAULT_PRIVACY_STATUS: public
          # Multi-language rotation: each daily run publishes every topic in the next
          # language in this list. Default below is US-targeted English only
          # (highest-RPM geo); add codes (hi es pt ar id …) to widen reach.
          CONTENT_LANGUAGES: "en"
          # Quality gate: minimum combined QC-agent score for a video to be
          # uploaded (technical probe + AI virality + AI policy review).
          QC_MIN_SCORE: "70"
          # Owner notification channel for manual actions and daily verdicts.
          OWNER_EMAIL: "arnab.laha2018@gmail.com"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional custom topics (pipe-separated, comma allowed inside a topic):
          # CONTENT_TOPICS: "Topic one|Topic two"
          # Daily output: 1 long-form + N Shorts derived from it (max 5 angles)
          DAILY_SHORTS: "3"
          # US prime-time publish slots (America/New_York). Long-form 7 PM ET,
          # Shorts 9 AM / 1 PM / 5 PM ET. Override all three to change.
          PUBLISH_TIMEZONE: "America/New_York"
          LONG_PUBLISH_HOUR: "19"
          SHORT_PUBLISH_HOURS: "9,13,17"
        run: |
          node scripts/run-automation-cron.js

      # The cron script exits non-zero when nothing was published — surface a
      # Telegram + email alert even if the run itself failed to send one
      # (belt & braces so a silent no-publish day can never hide behind a
      # green workflow).
      - name: Alert on no-publish
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: "arnab.laha2018@gmail.com"
        run: node scripts/alert-failure.js "no video was published in this run"


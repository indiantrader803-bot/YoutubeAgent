name: 24/7 Serverless Daily Video Automation

on:
  schedule:
    # Once daily at 6:00 AM IST (00:30 UTC). One run produces 1 Short + 1
    # long-form, keeping the channel under YouTube's daily upload cap.
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & FFmpeg
        run: |
          npm ci
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate and publish daily videos (1 Short + 1 long-form)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Videos upload as private with a future publishAt (= scheduled premiere at
          # peak time next day). This is the "prepare a day ahead" mode; set to public
          # to make every video go live immediately after upload instead.
          DEFAULT_PRIVACY_STATUS: private
          # Multi-language rotation: each daily run publishes every topic in the next
          # language in this list. Default below is US-targeted English only
          # (highest-RPM geo); add codes (hi es pt ar id …) to widen reach.
          CONTENT_LANGUAGES: "en"
          # Optional custom topics (pipe-separated, comma allowed inside a topic):
          # CONTENT_TOPICS: "Topic one|Topic two"
          # Daily output: 1 long-form + N Shorts derived from it (max 5 angles)
          DAILY_SHORTS: "3"
          # US prime-time publish slots (America/New_York). Long-form 7 PM ET,
          # Shorts 9 AM / 1 PM / 5 PM ET. Override all three to change.
          PUBLISH_TIMEZONE: "America/New_York"
          LONG_PUBLISH_HOUR: "19"
          SHORT_PUBLISH_HOURS: "9,13,17"
        run: |
          node scripts/run-automation-cron.js

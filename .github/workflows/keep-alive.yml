name: 24/7 Server Keep-Alive & Daily Video Automation

on:
  schedule:
    # Run every 5 minutes 24/7 to prevent Render free tier sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Server & Trigger Keep-Alive
        run: |
          echo "Pinging YouTube Automation Server on Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://youtube-automation-agent-mdv0.onrender.com/ping)
          echo "$RESPONSE"
          
          echo "Checking Health Endpoint..."
          HEALTH=$(curl -s https://youtube-automation-agent-mdv0.onrender.com/health)
          echo "$HEALTH"
          
          echo "✅ 24/7 Keep-Alive Ping Successful!"

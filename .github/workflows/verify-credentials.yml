name: Verify Credentials

# Runs after every push to master and proves — with REAL API calls, never
# printing values — that the secrets the daily 24/7 workflow depends on are
# present and working. Green here = the next daily run can publish.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The owner stores secrets in the repo Environment "ENV" (id 19935994265).
    # Declaring it here makes those secrets visible to this job. It has no
    # protection rules, so jobs start immediately.
    environment: ENV
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Verify YouTube + Gmail credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: "arnab.laha2018@gmail.com"
        run: node scripts/verify-deployment.js

      # Telegram reaches the owner even when the Gmail secrets themselves are
      # the missing ones (the notifier ships with the channel's default bot).
      - name: Alert owner on verification failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/alert-failure.js "repository secrets are missing/empty on the runner — YouTube + Gmail secrets were not found in repo Settings"
